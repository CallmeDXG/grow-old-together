# 《白头偕老》新开发计划 —— 对标《中国式家长》品质升级

## Context

基于对Steam爆款《中国式家长》（280万销量/93%好评）的深度调研，我们需要将当前的Ren'Py叙事原型升级为**回合制养成游戏**。当前原型验证了剧本和经济系统可行性，下一步是在Unity 2D中重构为完整的回合制生活模拟游戏。

---

## 一、核心架构转型

### 回合结构：57回合制

| 回合段 | 对应年龄 | 回合代表 | 特点 |
|--------|---------|---------|------|
| 1-4 | 18-21 | 1年/回合 | 高考+大学（教程+初恋） |
| 5 | 22 | 毕业抉择 | 城市+职业选择大界面 |
| 6-15 | 23-32 | 1年/回合 | 恋爱→结婚→婚后前期 |
| 16-30 | 33-47 | 1年/回合 | 中年主线（最高压力段） |
| 31-45 | 48-62 | 1年/回合 | 子女长大+父母衰老 |
| 46-57 | 63-75 | 1-3年/回合 | 晚年+终局 |

### 每回合固定流程（6阶段）

\`\`\`
①晨间新闻(30s) → ②时间分配(60s) → ③天平博弈(2-4min) → ④叙事事件(2-5min) → ⑤面子对决(每4-5回合) → ⑥结算画面(30s)
\`\`\`

---

## 二、核心迷你游戏 ——「天平博弈」

对标"挖脑洞"，每回合必玩：

- **形式**：棋盘式资源分配博弈。天平两端 = 事业面(3×3) vs 家庭面(3×3)
- **操作**：6步内放置筹码（加班/约会/学习/陪伴/自我等），兼顾收益最大化和天平平衡
- **核心规则**：倾斜度≤1安全，=2收益打折，≥3翻倒（本回合归零+触发负面事件）
- **同色连线**：3连+50%收益
- **随年龄进化**：22-28岁2×2（简单）→ 28-35岁3×3 → 35-45岁增加"孩子刚需行" → 55+事业面缩小
- **配偶AI反馈**：连续偏一侧→配偶抱怨，形成无完美解困境

---

## 三、时间分配系统

每回合6个时间槽，可分配：

**核心活动**：工作(≥2槽必填) / 陪伴配偶 / 自我提升 / 休息 / 社交  
**阶段活动**：副业 / 带孩子(有娃后≥1槽) / 照顾父母 / 备考 / 健身 / 发展爱好

**设计核心**：时间永远不够用，6槽分配的不同组合直接决定收入、关系、健康的此消彼长。

---

## 四、「年夜饭对决」—— 面子系统

对标"面子对决"，每4-5回合触发：

- **场景**：春节年夜饭 / 同学聚会 / 婚礼 / 家庭聚餐 / 家长群
- **机制**：3轮出牌比较，"攀比牌"根据玩家真实资产/成就自动生成
- **牌类型**：收入牌/房产牌/车辆牌/孩子牌/职位牌/存款牌/反攀比牌
- **联动设计**：输了→焦虑+面子消费冲动→钱花多了→触发吵架系统→离婚风险

---

## 五、结局系统 —— 72个结局

| 大类 | 数量 | 代表 |
|------|------|------|
| A. 白头偕老 | 12 | 金婚典范/细水长流/风雨同舟/浪漫到老 |
| B. 离婚-各自安好 | 8 | 和平分手/各有精彩 |
| C. 离婚-再婚 | 8 | 二婚真香/重新开始 |
| D. 单身终老 | 6 | 自由万岁/遗憾独行 |
| E. 悲剧类 | 8 | 重病/意外/极端事件 |
| F. 隐藏/彩蛋 | 24 | 人生赢家/摆烂哲学/反向操作/铁饭碗胜利 |

结局由**婚姻质量分**(love×0.25 + trust×0.3 + respect×0.2 + 经济×0.15 + 幸福×0.1) + 经历标签 + 特殊条件综合判定。

---

## 六、重玩性钩子 ——「人生回响」系统

替代"代际继承"：

- 通关获得**回响点**（30-80点/局），用于购买永久加成
- **A类-数值加成**：初始love+5 / 存款+20000 / 健康衰减×0.8
- **B类-解锁内容**：新配偶类型 / 新副业 / 新城市 / 双线模式 / 关键选择重来1次
- **C类-命运碎片**：meta叙事，收集全结局解锁真结局
- **多周目差异**：第2次解锁另一性别 / 第3次NPC记得你 / 第5次自由模式 / 第10次真结局

---

## 七、开发阶段与工期

### Phase 1：垂直切片（6周）
- 创建Unity 2D项目
- 实现10回合可玩demo
- 天平博弈迷你游戏核心原型
- 时间分配UI
- 20个手写事件
- 10个结局

### Phase 2：系统贯通（8周）
- 经济三联动完整接入
- 年夜饭对决系统
- NPC关系网（6位配偶+4位亲友）
- 57回合跑通
- 30个结局

### Phase 3：内容填充（12周）
- AI Agent批量生成500+事件（人工审核）
- 全美术资源（角色×年龄变化+15-20张背景+UI）
- 音频（BGM+SFX）
- 72个结局全部完成
- 回响系统

### Phase 4：测试+上线（6周）
- Alpha/Beta测试
- 数值平衡调优（自动化模拟跑几千次）
- Steam商店页+宣传素材
- Early Access上线

**总工期：32周（约8个月）**，1人+AI约10-12个月，2人+AI约7-9个月。

---

## 八、MVP定义（Steam Early Access最低标准）

- 男主线57回合完整可玩
- 200+事件
- 6种配偶候选
- 15+结局
- 天平博弈+时间分配+年夜饭对决 三大系统
- 经济三联动（失业/吵架/副业）
- 完整美术和UI
- 定价：¥28-36

---

## 九、技术栈决策

| 项目 | 决定 | 理由 |
|------|------|------|
| 引擎 | Unity 2D | UI交互+小游戏+回合制需要灵活控制 |
| 当前Ren'Py | 保留作为剧本验证原型 | 已验证的对话/数值逻辑可迁移 |
| AI Agent | 49个Game Studio Agent | 用于内容生成/平衡测试/代码审查 |
| 数据管理 | YAML/JSON配置表驱动 | 现有数据文件直接复用 |
| 平台 | Steam → iOS/Android → 华为 | 按优先级逐步发布 |

---

## 十、最大风险与缓解

| 风险 | 概率 | 影响 | 缓解 |
|------|------|------|------|
| 事件内容重复无聊 | 高 | 致命 | AI批量生成+人工精修+玩家反馈迭代 |
| 天平博弈不好玩 | 中高 | 体验受损 | Phase 1立刻验证，不好玩就换方案 |
| 美术资源瓶颈 | 高 | 延期 | 先用占位资源跑通，美术并行外包 |
| 数值不平衡 | 中 | 口碑差 | 自动化模拟+EA期间收集数据调优 |

---
